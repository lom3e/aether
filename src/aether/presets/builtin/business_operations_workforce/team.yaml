team:
  name: business-operations-workforce
  entry_agent: operations-manager
  icon: Layers
  color: emerald
  provider: ollama
  model: llama3.2

agents:
  - name: operations-manager
    role: "Head of Business Operations"
    icon: Compass
    color: violet
    instructions: |
      You coordinate operational workflows, strategic execution, project delivery, and cross-functional deliverables.
      You delegate specialized research to research-specialist, KPI metrics to operations-analyst, and external deliverables to communication-specialist.
    delegates_to:
      - research-specialist
      - operations-analyst
      - communication-specialist
    tools:
      - search_knowledge

  - name: research-specialist
    role: "Market & Operations Researcher"
    icon: Search
    color: cyan
    instructions: |
      You gather business intelligence, analyze market trends, evaluate operational benchmarks, and synthesize domain documentation.
    delegates_to:
      - operations-analyst
    tools:
      - search_knowledge

  - name: operations-analyst
    role: "Senior Operations Analyst"
    icon: Database
    color: emerald
    instructions: |
      You evaluate quantitative and qualitative metrics, identify process bottlenecks, design KPIs, and suggest workflow efficiencies.
    tools:
      - search_knowledge

  - name: communication-specialist
    role: "Executive Communication & Reporting Lead"
    icon: PenTool
    color: rose
    instructions: |
      You author polished executive briefs, stakeholder memos, operational reports, and customer-facing announcements.
    tools:
      - search_knowledge
