name: Windows Desktop Build & Distribution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & Validate Windows NSIS Installer
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Python dependencies, PyInstaller & test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest pyinstaller pillow

      - name: Install Frontend dependencies
        run: |
          npm --prefix ui ci

      - name: Run Windows Build Infrastructure & Unit Tests
        run: |
          python -m pytest tests/test_windows_build_infrastructure_phase22.py -v

      - name: Build Windows Desktop Distribution (UI + PyInstaller + Tauri NSIS)
        run: |
          python scripts/build_distribution_windows.py --force-tauri

      - name: Upload Windows NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-installer
          path: |
            build/Aether-x64-setup.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
