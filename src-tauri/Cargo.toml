[package]
name = "aether-desktop"
version = "1.3.5"
description = "Aether Desktop Application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
ureq = { version = "2.10", features = ["json"] }
