[package]
name = "aether-desktop"
version = "1.8.1"
description = "Aether Desktop Application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
ureq = { version = "2.10", features = ["json"] }
tauri-plugin-updater = "2"

[features]
# Test-only hook: on start, check/install an update automatically (AETHER_E2E_UPDATE=1). Never enabled in release builds.
updater-e2e = []
