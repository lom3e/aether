[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "aether-ai"
version = "1.7.1"
description = "Autonomous Multi-Agent Workforce Platform with Built-in Memory and Coordination"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matteo", email = "aether@lmlabs.it" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-multipart>=0.0.9",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-genai>=0.1.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0", "google-genai>=0.1.0"]

[project.urls]
Homepage = "https://github.com/lom3e/aether"
Repository = "https://github.com/lom3e/aether.git"
"Bug Tracker" = "https://github.com/lom3e/aether/issues"

[project.scripts]
aether = "aether.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aether = [
    "presets/builtin/**/*.yaml",
    "presets/builtin/**/*.md",
    "presets/builtin/**/*.json",
    "server/static/**/*",
]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
markers = [
    "integration: documents that the test exercises a locally running service. It grants NO credentials and NO external network; combine it with ollama/external_network when a connection is really needed.",
    "live_provider: real external provider test. Only these tests receive the real API keys and have no network guard; they must additionally skip unless their own explicit opt-in environment is set (e.g. AETHER_RUN_LIVE_GROQ=1).",
    "mock_provider: marks isolated mock provider tests.",
    "external_network: opt-in to exactly the hosts given as arguments, e.g. external_network('api.example.com'); loopback stays allowed, provider keys stay hidden. Without hosts it is an error.",
    "ollama: opt-in to the local Ollama port (loopback 11434); no other destination, no provider keys.",
    "network_block_expected: the test deliberately triggers a refused network attempt (tests of the guard itself); the teardown failure for refused attempts is waived.",
]
